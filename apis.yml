aid: sparetech
name: Sparetech
description: >-
  SPARETECH is an enterprise MRO (Maintenance, Repair and Operations) SaaS that helps
  manufacturing maintenance and procurement teams reduce spend and optimize spare-parts
  inventory. Founded in 2018 in Stuttgart, Germany, it pairs a global catalog of 40M+
  original manufacturer part records with proprietary matching and AI to deliver
  automated duplicate detection, data enrichment, obsolescence management and BOM
  processing. It is a 100% cloud SaaS, available in 14 languages, an official SAP
  partner in the SAP Store, and certified under SOC 2 Type II, ISO 27001 and GDPR.
  For developers it exposes a REST Sync API (v1 for all ERPs, v2 for SAP S/4HANA)
  using JWT authentication with a dedicated sandbox for material creation, change and
  extension synchronization between SPARETECH and ERP/CMMS/MDM systems. Customers
  include Bosch, Porsche, BMW, Volkswagen, Nestlé and Sanofi.
