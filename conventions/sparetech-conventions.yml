summary: >-
  Cross-cutting request/response semantics of the Sparetech Sync API, derived from
  the v1/v2 OpenAPI and the ReDoc documentation. The Sync API integrates a
  customer's ERP/CMMS/MDM with the SPARETECH platform for material master
  creation, change and extension synchronization.
authentication:
  style: bearer-jwt
  detail: >-
    JWT bearer token (securityScheme "Token"). Client credentials are issued by
    SPARETECH per organisation and integration environment and are exchanged for a
    token at POST /oauth/token (Auth0-backed) or POST /auth. A basic-auth scheme
    "ClientCredentials" is also declared for the token exchange.
  see: authentication/sparetech-authentication.yml
idempotency:
  supported: false
  detail: >-
    No idempotency-key header or parameter is documented in the OpenAPI. Write
    operations are modeled as intents (creation/change/extension) that are
    confirmed or rejected, which provides an approval workflow rather than an
    idempotency contract.
